global:
  delay_seconds: 1.0
  max_download_mb: 2000
  dedup_ttl_hours: 48
  log_retention_days: 30
  log_max_rows: 5000
  album_quiet_seconds: 15       # 同组没有新增媒体的等待时间（秒）
  album_max_wait_seconds: 45    # 从首项开始计时，必须不小于静默等待时间
  comment_wait_seconds: 30
  comment_merge_mode: pack
  # Optional: override .env Telegram API credentials from Web UI or here
  # api_id: 12345678
  # api_hash: "0123456789abcdef0123456789abcdef"

accounts:
  - id: default
    name: 主账号
    enabled: true

regex_rules:
  - id: rx_ad_skip
    name: 通用广告跳过
    kind: skip
    patterns:
      - "(?i)#sponsored|广告推广"
  - id: rx_footer_strip
    name: 去除关注尾巴
    kind: strip
    patterns:
      - "(?m)^.*关注备用频道.*$"
  - id: rx_channel_replace
    name: 替换频道署名
    kind: replace
    replace_patterns:
      - pattern: "@old_channel"
        repl: "@my_channel"

rules:
  - name: 示例搬运规则
    enabled: false
    account_id: default
    sources:
      - -1001234567890
    targets:
      - -1009876543210
    drop_author: true
    fallback_reupload: true
    skip_text_only: false
    strip_all_text: false
    skip_empty_text_only: true
    disable_link_preview: false
    collect_comments: false
    # Optional per-rule overrides (omit to inherit global defaults):
    # comment_wait_seconds: 30
    # comment_merge_mode: pack
    regex_ids:
      - rx_ad_skip
      - rx_footer_strip
      - rx_channel_replace
